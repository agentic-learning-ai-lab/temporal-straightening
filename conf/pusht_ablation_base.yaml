# PushT trajectory-penalty ablation base config.
#
# Copied from conf/umaze_ablation_base.yaml (Daniel's wall_ablation_base layout)
# with ONLY the `env` block swapped to PushT and epochs set to 2 (paper A.3).
# Everything else -- encoder (dino_channel: patch tokens + channel projector to
# dim 8 + mlp agg head), predictor, decoder, and training hyperparameters -- is
# unchanged so PushT-vs-Wall/UMaze is a clean env-only comparison.
#
# The trajectory penalty is selected at the CLI via training.straighten using
# Daniel's r0..r4 / aggr0..aggr4 tokens (models/visual_world_model.py,
# trajectory_penalties). This config's default is R0 (aggcos1e-1), i.e. the
# straightening baseline == your pusht straightening_reproduction row; the
# sequence runner overrides it per condition (aggr1_1e-1, aggr2_5e-2, aggr3b1_1e-1).
#
# REQUIRES: the checkout must contain Daniel's trajectory_penalties loss
# (r0..r4 parser + method). Merge or cherry-pick from
# origin/agent/wall-speed-ablation first -- do NOT re-implement the loss.

ckpt_base_path: baseline_artifacts/checkpoints/pusht_speed_ablations
training:
  seed: 0
  epochs: 2                       # PushT trains 2 epochs (paper A.3); wall/umaze use 20
  batch_size: 32
  save_every_x_epoch: 1
  save_every_x_iterations: 1000
  straighten: aggcos1e-1         # R0 baseline; sequence runner overrides per condition
  decoder_start_epoch: 1
  reconstruct_every_x_batch: 1000
  num_reconstruct_samples: 5
  encoder_lr: 1.0e-05             # straightening/penalty ON rows use 1e-5 on PushT
  decoder_lr: 0.0003
  predictor_lr: 0.0005
  action_encoder_lr: 0.0005
  stop_grad: true
  vcreg: false
  vcreg_apply_to: enc
  vcreg_std_coeff: 0
  vcreg_cov_coeff: 0
  mixed_precision: bf16
img_size: 224
frameskip: 5
concat_dim: 1
normalize_action: true
action_emb_dim: 10
num_action_repeat: 1
proprio_emb_dim: 10
num_proprio_repeat: 1
num_hist: 3
num_pred: 1
has_predictor: true
has_decoder: true
model:
  _target_: models.visual_world_model.VWorldModel
  image_size: 224
  num_hist: 3
  num_pred: 1
  train_encoder: true
  train_predictor: true
  train_decoder: true
plan_settings:
  plan_cfg_path: null
  planner:
    - gd
    - cem
  goal_source:
    - dset
    - random_state
  goal_H:
    - 5
  alpha:
    - 0.1
    - 1
debug: false
# --- the ONLY block that differs from umaze_ablation_base --------------------
env:
  name: pusht
  args: []
  kwargs:
    with_velocity: true
    with_target: true
  dataset:
    _target_: datasets.pusht_dset.load_pusht_slice_train_val
    with_velocity: true
    n_rollout: null
    normalize_action: true
    data_path: ${oc.env:DATASET_DIR}/pusht_noise
    split_ratio: 0.9
    transform:
      _target_: datasets.img_transforms.default_transform
      img_size: 224
  decoder_path: null
  num_workers: 16
# --- everything below is copied verbatim from umaze_ablation_base -----------
encoder:
  _target_: models.dino.DinoV2Encoder
  name: dinov2_vits14
  feature_key: x_norm_patchtokens
  projector: channel
  agg_type: mlp
  agg_mlp_hidden_dim: 512
  agg_out_dim: 128
  projector_out_dim: 8
  hidden_dim: 192
  projector_config:
    _target_: models.dino.ChannelProjector
    in_dim: 384
    out_dim: 8
    norm_type: layer
    conv_layers:
      - kernel_size: 3
        stride: 1
        padding: 1
        in_dim: 384
        out_dim: 192
      - kernel_size: 3
        stride: 1
        padding: 1
        in_dim: 192
        out_dim: 8
action_encoder:
  _target_: models.proprio.ProprioceptiveEmbedding
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
  use_layernorm: true
proprio_encoder:
  _target_: models.proprio.ProprioceptiveEmbedding
  num_frames: 1
  tubelet_size: 1
  use_3d_pos: false
  use_layernorm: true
decoder:
  _target_: models.vqvae.VQVAE
  channel: 384
  n_embed: 2048
  n_res_block: 4
  n_res_channel: 128
  quantize: false
predictor:
  _target_: models.vit.ViTPredictor
  depth: 6
  heads: 16
  mlp_dim: 2048
  dropout: 0.1
  emb_dropout: 0
  pool: mean
